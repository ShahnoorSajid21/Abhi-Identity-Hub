<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Inline SVG, for the reason AbhiLogo.tsx gives for the lockup: it cannot
      404. This link used to point at /abhi-mark.png in a public/ directory
      that has never existed in this repository, so every page load fetched a
      missing favicon. The lockup was fixed by inlining it; this was missed,
      and stayed missed because a failed favicon shows no error anywhere.

      Navy ground with the brand's mosaic gesture in mint — the same quotation
      from the master artwork that AbhiLogo draws at full size.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1128'/%3E%3Cg fill='%2300d09c'%3E%3Crect x='13' y='6' width='5' height='5'/%3E%3Crect x='7' y='12' width='5' height='5'/%3E%3Crect x='13' y='12' width='5' height='5'/%3E%3Crect x='19' y='12' width='5' height='5'/%3E%3Crect x='13' y='18' width='5' height='5'/%3E%3Crect x='19' y='18' width='5' height='5'/%3E%3Crect x='7' y='24' width='5' height='5'/%3E%3Crect x='19' y='24' width='5' height='5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>ABHI Identity Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
