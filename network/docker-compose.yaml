# ABHI Unified KYC Ledger — local Fabric network (POC).
#
# 3 orderers (Raft) + 3 peers + 3 CouchDB. Production replaces this with the
# Kubernetes manifests in infrastructure/k8s: 5 orderers across 3 AZs and
# 2 peers per organization.
#
#   docker compose -f network/docker-compose.yaml up -d
name: abhi-kyc-ledger

volumes:
  orderer0: {}
  orderer1: {}
  orderer2: {}
  peer0bank: {}
  peer0lending: {}
  peer0compliance: {}

networks:
  abhi:
    name: abhi-kyc

x-orderer-common: &orderer-common
  image: hyperledger/fabric-orderer:2.5.9
  environment:
    - FABRIC_LOGGING_SPEC=INFO
    - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
    - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
    - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
    - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    - ORDERER_GENERAL_TLS_ENABLED=true
    - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
  command: orderer
  networks: [abhi]

x-peer-common: &peer-common
  image: hyperledger/fabric-peer:2.5.9
  environment: &peer-env
    - FABRIC_LOGGING_SPEC=INFO
    - CORE_PEER_TLS_ENABLED=true
    - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
    - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
    - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    - CORE_PEER_PROFILE_ENABLED=false
    - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=abhi-kyc
    - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
    - CORE_CHAINCODE_EXTERNALBUILDERS=
    - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    - CORE_METRICS_PROVIDER=prometheus
  command: peer node start
  networks: [abhi]

x-couch-common: &couch-common
  image: couchdb:3.3
  environment:
    # No credential literals anywhere (finding SEC-09). The `:?` form makes
    # compose FAIL rather than silently default, so a missing secret is a loud
    # startup error instead of a weak password nobody notices.
    # Local values: cp network/.env.example network/.env
    # Production injects these from HashiCorp Vault at deploy time.
    - COUCHDB_USER=${COUCHDB_USER:?set COUCHDB_USER in network/.env}
    - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in network/.env}
  networks: [abhi]

services:
  # ---------------------------------------------------------------- ordering
  orderer0.abhi.local:
    <<: *orderer-common
    container_name: orderer0.abhi.local
    environment:
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports: ["7050:7050", "7053:7053"]
    volumes:
      - ./organizations/ordererOrganizations/abhi.local/orderers/orderer0.abhi.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/abhi.local/orderers/orderer0.abhi.local/tls:/var/hyperledger/orderer/tls
      - orderer0:/var/hyperledger/production/orderer

  orderer1.abhi.local:
    <<: *orderer-common
    container_name: orderer1.abhi.local
    environment:
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:8053
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports: ["8050:8050", "8053:8053"]
    volumes:
      - ./organizations/ordererOrganizations/abhi.local/orderers/orderer1.abhi.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/abhi.local/orderers/orderer1.abhi.local/tls:/var/hyperledger/orderer/tls
      - orderer1:/var/hyperledger/production/orderer

  orderer2.abhi.local:
    <<: *orderer-common
    container_name: orderer2.abhi.local
    environment:
      - ORDERER_GENERAL_LISTENPORT=9050
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9053
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports: ["9050:9050", "9053:9053"]
    volumes:
      - ./organizations/ordererOrganizations/abhi.local/orderers/orderer2.abhi.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/abhi.local/orderers/orderer2.abhi.local/tls:/var/hyperledger/orderer/tls
      - orderer2:/var/hyperledger/production/orderer

  # ------------------------------------------------------------------- state
  couchdb.bank:
    <<: *couch-common
    container_name: couchdb.bank
    ports: ["5984:5984"]

  couchdb.lending:
    <<: *couch-common
    container_name: couchdb.lending
    ports: ["6984:5984"]

  couchdb.compliance:
    <<: *couch-common
    container_name: couchdb.compliance
    ports: ["7984:5984"]

  # ------------------------------------------------------------------- peers
  peer0.bank.abhi.local:
    <<: *peer-common
    container_name: peer0.bank.abhi.local
    depends_on: [couchdb.bank]
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.bank.abhi.local
      - CORE_PEER_ADDRESS=peer0.bank.abhi.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bank.abhi.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bank.abhi.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bank.abhi.local:7051
      - CORE_PEER_LOCALMSPID=ABHIBankMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.bank:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD}
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=abhi-kyc
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - CORE_METRICS_PROVIDER=prometheus
    ports: ["7051:7051", "9443:9443"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/bank.abhi.local/peers/peer0.bank.abhi.local/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/bank.abhi.local/peers/peer0.bank.abhi.local/tls:/etc/hyperledger/fabric/tls
      - peer0bank:/var/hyperledger/production

  peer0.lending.abhi.local:
    <<: *peer-common
    container_name: peer0.lending.abhi.local
    depends_on: [couchdb.lending]
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.lending.abhi.local
      - CORE_PEER_ADDRESS=peer0.lending.abhi.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.lending.abhi.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.lending.abhi.local:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.lending.abhi.local:8051
      - CORE_PEER_LOCALMSPID=ABHILendingMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.lending:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD}
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=abhi-kyc
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - CORE_METRICS_PROVIDER=prometheus
    ports: ["8051:8051", "9444:9443"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/lending.abhi.local/peers/peer0.lending.abhi.local/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/lending.abhi.local/peers/peer0.lending.abhi.local/tls:/etc/hyperledger/fabric/tls
      - peer0lending:/var/hyperledger/production

  peer0.compliance.abhi.local:
    <<: *peer-common
    container_name: peer0.compliance.abhi.local
    depends_on: [couchdb.compliance]
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.compliance.abhi.local
      - CORE_PEER_ADDRESS=peer0.compliance.abhi.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.compliance.abhi.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.compliance.abhi.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.compliance.abhi.local:9051
      - CORE_PEER_LOCALMSPID=ABHIComplianceMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.compliance:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD}
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=abhi-kyc
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - CORE_METRICS_PROVIDER=prometheus
    ports: ["9051:9051", "9445:9443"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/compliance.abhi.local/peers/peer0.compliance.abhi.local/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/compliance.abhi.local/peers/peer0.compliance.abhi.local/tls:/etc/hyperledger/fabric/tls
      - peer0compliance:/var/hyperledger/production

  # -------------------------------------------------------------- off-chain
  vault-db:
    image: postgres:16-alpine
    container_name: vault-db
    environment:
      - POSTGRES_DB=abhi_vault
      - POSTGRES_USER=${VAULT_DB_USER:?set VAULT_DB_USER in .env}
      # POC ONLY — production injects this from HashiCorp Vault.
      - POSTGRES_PASSWORD=${VAULT_DB_PASSWORD:?set VAULT_DB_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes:
      - ../vault/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [abhi]
