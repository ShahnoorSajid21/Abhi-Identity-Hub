# Crypto material generation for the POC ONLY.
#
# cryptogen is a development tool. It generates all private keys in one place,
# which is precisely what production must not do: production uses Fabric CA per
# organization with an offline root, HSM-backed intermediates, and keys that are
# generated inside the HSM and never exported.
#
# Using cryptogen output above a development environment is a control failure.
# See docs/SECURITY_AUDIT.md finding SEC-03.
#
# SANS. Every node gets localhost and 127.0.0.1 as subject alternative names
# because the peer CLI and the gateway both dial localhost:<port> from the
# host, while the certificate's common name is the container hostname. Without
# them TLS fails with "certificate is valid for peer0.bank.abhi.local, not
# localhost" and nothing can be installed, approved or invoked. Production
# issues per-node certificates from Fabric CA for the real DNS names and has
# no localhost in them at all.
---
OrdererOrgs:
  - Name: Orderer
    Domain: abhi.local
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer0
        SANS: [localhost, 127.0.0.1]
      - Hostname: orderer1
        SANS: [localhost, 127.0.0.1]
      - Hostname: orderer2
        SANS: [localhost, 127.0.0.1]

PeerOrgs:
  - Name: ABHIBank
    Domain: bank.abhi.local
    EnableNodeOUs: true
    Template:
      Count: 1        # production: 2 peers across >=2 availability zones
      SANS: [localhost, 127.0.0.1]
    Users:
      Count: 1        # the gateway client identity

  - Name: ABHILending
    Domain: lending.abhi.local
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS: [localhost, 127.0.0.1]
    Users:
      Count: 1

  - Name: ABHICompliance
    Domain: compliance.abhi.local
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS: [localhost, 127.0.0.1]
    Users:
      Count: 2        # gateway client + a named compliance officer
